services:
  # 1. Backend Web Service (Node.js Express)
  - type: web
    name: trustx-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: API_KEY_URLSCAN
        sync: false
      - key: VIRUSSZTOTAL_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: trustx-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: trustx-backend
          property: host

